<!DOCTYPE html>

<style>
  :root{
    --ink:#20242e;--ink-soft:#5a6072;--line:#ece6dc;--bg:#faf7f2;--card:#fff;
    --navy:#1b2a4a;--navy2:#2d4373;--sakura:#e07a9b;--sakura-soft:#fbe8ee;--gold:#c8a24a;--ok:#2f8f62;--warn:#c7682e;
    --shadow:0 8px 30px rgba(27,42,74,.09);--shadow-sm:0 2px 10px rgba(27,42,74,.06);--r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Noto Sans TC","PingFang TC","Hiragino Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px}
  .hero{background:linear-gradient(150deg,#0d1526,#1b2a4a 55%,#2d4373);color:#fff;padding:calc(env(safe-area-inset-top) + 26px) 22px 56px;position:relative;overflow:hidden}
  .hero::after{content:"🌸";position:absolute;font-size:150px;right:-28px;top:-20px;opacity:.10;transform:rotate(-12deg)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.5px;font-size:20px}
  .brand .dot{color:var(--sakura)}
  .tagline{margin-top:6px;font-size:13px;opacity:.88;max-width:80%}
  .lang-btn{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:16px;z-index:3;background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .panel{background:var(--card);border-radius:22px;margin:-34px 16px 0;padding:18px 16px 20px;box-shadow:var(--shadow);position:relative;z-index:2}
  .field{margin-bottom:15px}.field:last-child{margin-bottom:0}
  label.l{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
  .region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .region{position:relative;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:9px 3px 7px;text-align:center;cursor:pointer;transition:.16s;font-size:11.5px;font-weight:600;color:var(--ink)}
  .region .emo{font-size:22px;display:block;margin-bottom:2px}
  .region.active{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:var(--shadow-sm)}
  .region .ord{position:absolute;top:-6px;right:-6px;background:var(--sakura);color:#fff;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .reg-sum{margin-top:10px;font-size:12px;color:var(--navy2);background:var(--bg);border-radius:12px;padding:9px 12px;line-height:1.55}.reg-sum b{color:var(--navy)}
  .days-row{display:flex;align-items:center;gap:12px}
  .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
  .stepper button{width:44px;height:46px;border:0;background:#fff;font-size:22px;color:var(--navy);cursor:pointer;font-weight:600}
  .stepper .val{width:52px;text-align:center;font-size:19px;font-weight:800}
  .days-hint{font-size:12.5px;color:var(--ink-soft)}
  .date-input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;background:#fff;font-weight:600;color:var(--ink-soft)}
  .chip.active{background:var(--sakura-soft);border-color:var(--sakura);color:#b43e63}
  .go{width:100%;margin-top:18px;border:0;border-radius:16px;padding:16px;font-size:16.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--sakura),#cf5d82);cursor:pointer;letter-spacing:1px;box-shadow:0 8px 22px rgba(207,93,130,.33)}
  .go:active{transform:scale(.98)}.go[disabled]{opacity:.6}
  #results{padding:0 16px;margin-top:20px}
  .sec{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
  .sec-h{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;font-size:15px;font-weight:800}.sec-h .ic{font-size:19px}
  .sec-b{padding:0 16px 16px}
  .trip-meta{background:linear-gradient(135deg,#243a63,#32528a);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .trip-meta .big{font-size:19px;font-weight:800}.trip-meta .sub{font-size:12.5px;opacity:.85;margin-top:2px}.trip-meta .r{text-align:right;font-size:12.5px;opacity:.9}
  .open3d{width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#1f6feb,#0d47a1);cursor:pointer;box-shadow:0 8px 22px rgba(13,71,161,.35);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
  .open3d:active{transform:scale(.98)}
  .fx-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.fx-rate{font-size:26px;font-weight:800;color:var(--navy)}.fx-unit{font-size:13px;color:var(--ink-soft)}
  .fx-note{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .conv{display:flex;gap:8px;margin-top:12px;align-items:center}.conv input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;text-align:right}.conv .cur{font-size:12px;color:var(--ink-soft);font-weight:700;width:34px}.conv .eq{color:var(--ink-soft);font-weight:700}
  .wx-scroll{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px}.wx-scroll::-webkit-scrollbar{display:none}
  .wx-day{flex:0 0 auto;width:76px;background:var(--bg);border-radius:14px;padding:11px 6px;text-align:center}.wx-day .d{font-size:11px;color:var(--ink-soft);font-weight:700}.wx-day .ico{font-size:26px;margin:4px 0}.wx-day .t{font-size:13px;font-weight:800}.wx-day .t .lo{color:var(--ink-soft);font-weight:600}.wx-day .rain{font-size:10.5px;color:#3a6ea5;margin-top:2px}
  .tr-sys{font-size:13.5px;font-weight:700;color:var(--navy)}.tr-row{font-size:12.5px;color:var(--ink-soft);margin-top:6px}.tr-row b{color:var(--ink)}
  .hotel{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.hotel:first-child{border-top:0}.hotel .tier{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--sakura-soft)}.hotel .info{flex:1;min-width:0}.hotel .nm{font-weight:700;font-size:14.5px}.hotel .meta{font-size:12px;color:var(--ink-soft);margin-top:1px}.hotel .price{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:3px}.hotel a.book{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--navy2);text-decoration:none;border:1.5px solid var(--line);padding:5px 11px;border-radius:10px}
  .seg-h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin:18px 2px 8px;padding-top:14px;border-top:2px dashed var(--line)}.seg:first-of-type .seg-h{border-top:0;padding-top:0;margin-top:4px}.seg-h .flag{font-size:22px}
  .day{margin-bottom:14px}.day-tab{display:flex;align-items:center;gap:10px;margin-bottom:8px}.day-badge{background:var(--navy);color:#fff;font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px}.day-title{font-size:13px;color:var(--ink-soft);font-weight:600}
  .stop{display:flex;gap:12px;position:relative;padding-bottom:13px}.stop::before{content:"";position:absolute;left:17px;top:34px;bottom:0;width:2px;background:var(--line)}.stop:last-child::before{display:none}
  .stop .pin{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--sakura-soft);display:flex;align-items:center;justify-content:center;font-size:16px;z-index:1;font-weight:800;color:#b43e63}
  .stop .c{flex:1;min-width:0;padding-top:2px}.stop .time{font-size:11px;color:var(--sakura);font-weight:800}.stop .nm{font-weight:700;font-size:14.5px}.stop .ds{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .stop .tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}.stop .tg{font-size:10.5px;background:var(--bg);color:var(--ink-soft);padding:2px 8px;border-radius:999px;font-weight:600}
  .stop .nav{font-size:11px;color:#fff;background:#1f6feb;text-decoration:none;font-weight:700;padding:3px 9px;border-radius:9px;cursor:pointer}
  .freeday{background:var(--bg);border-radius:12px;padding:12px 13px}.flex-intro{font-weight:700;color:var(--navy);font-size:13px;margin-bottom:6px}.flex-sub{font-size:11.5px;color:var(--ink-soft);margin:6px 0 2px}
  .flex-spot{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}.flex-spot span{flex:1;min-width:0}.flex-spot b{color:var(--navy)}.flex-spot a{flex:0 0 auto;font-size:11px;color:#fff;background:#1f6feb;text-decoration:none;font-weight:700;padding:3px 9px;border-radius:9px}
  .flex-ideas{margin:8px 0 0;padding-left:18px}.flex-ideas li{font-size:12.5px;color:var(--ink-soft);margin:4px 0}
  .toolbar{display:flex;gap:10px;margin:4px 0 10px}.toolbar button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-weight:700;font-size:13.5px;color:var(--navy);cursor:pointer;font-family:inherit}.toolbar button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
  .loading{text-align:center;padding:30px 0;color:var(--ink-soft);font-size:13px}.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--sakura);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
  .err{font-size:12px;color:var(--warn)}
  .foot{text-align:center;font-size:11px;color:var(--ink-soft);padding:18px 24px 6px;line-height:1.7}
  .about{font-size:10.5px;color:#9aa0b0;line-height:1.6;padding:0 4px}
  .fade{animation:fade .4s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes sp{to{transform:rotate(360deg)}}

  /* ===== 3D 全螢幕地圖 ===== */
  #mapOverlay{position:fixed;inset:0;z-index:50;background:#0d1526;display:none}
  #mapOverlay.on{display:block}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:9px!important}
  .m-top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;z-index:10;display:flex;gap:8px;align-items:center;pointer-events:none}
  .m-top>*{pointer-events:auto}
  .m-close{width:40px;height:40px;border-radius:50%;border:0;background:rgba(13,21,38,.82);color:#fff;font-size:20px;font-weight:800;cursor:pointer;backdrop-filter:blur(6px)}
  .day-pills{display:flex;gap:6px;overflow-x:auto;flex:1}.day-pills::-webkit-scrollbar{display:none}
  .day-pill{flex:0 0 auto;border:0;background:rgba(13,21,38,.82);color:#fff;font-weight:800;font-size:12.5px;padding:9px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
  .day-pill.active{background:#1f6feb}
  .m-bottom{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:10;display:flex;flex-direction:column;gap:10px}
  .m-actions{display:flex;gap:8px}
  .m-btn{flex:1;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:13.5px;color:#fff;background:rgba(13,21,38,.85);cursor:pointer;backdrop-filter:blur(6px);font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
  .m-btn.blue{background:#1f6feb}.m-btn.green{background:var(--ok)}
  .avatar-toggle{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 60px);z-index:10;border:0;border-radius:14px;padding:9px 12px;font-weight:800;font-size:12.5px;color:#fff;background:rgba(13,21,38,.82);cursor:pointer;backdrop-filter:blur(6px);font-family:inherit}
  /* Turn-by-turn HUD */
  .hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;z-index:11;background:rgba(13,21,38,.9);color:#fff;border-radius:18px;padding:14px 16px;backdrop-filter:blur(10px);display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .hud.on{display:block}
  .hud-main{display:flex;align-items:center;gap:14px}
  .hud-arrow{font-size:34px;width:46px;text-align:center}
  .hud-txt{flex:1;min-width:0}
  .hud-dist{font-size:22px;font-weight:800;line-height:1.1}
  .hud-instr{font-size:13px;opacity:.9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-then{margin-top:8px;font-size:11.5px;opacity:.7;border-top:1px solid rgba(255,255,255,.15);padding-top:6px}
  .hud-exit{position:absolute;top:10px;right:12px;background:none;border:0;color:#fff;opacity:.6;font-size:16px;cursor:pointer}
  .hud-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;opacity:.85}
  /* spot popup card */
  .spot-card{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:9;background:#fff;border-radius:16px;padding:13px 15px;box-shadow:0 12px 34px rgba(0,0,0,.3);display:none}
  .spot-card.on{display:block;animation:fade .3s ease}
  .spot-card .t{font-weight:800;font-size:15px}.spot-card .d{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .spot-card .x{position:absolute;top:8px;right:12px;border:0;background:none;font-size:16px;color:var(--ink-soft);cursor:pointer}
  .mpin{width:26px;height:26px;border-radius:50% 50% 50% 0;background:#1f6feb;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .mpin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:12px}
  .mpin.start{background:var(--ok)}.mpin.end{background:#e0444a}
  .m-avatar{font-size:26px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));transition:none}
  .m-toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:12;background:rgba(13,21,38,.9);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;font-size:14px;display:none;backdrop-filter:blur(6px)}
  .m-toast.on{display:block;animation:fade .3s ease}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <button class="lang-btn" id="langBtn">EN</button>
    <div class="brand">🗾 櫻旅 3D<span class="dot"> ・</span>導航</div>

  <section class="panel" id="panel">
    <div class="field"><label class="l" data-i="lbRegion"></label><div class="region-grid" id="regionGrid"></div><div class="reg-sum" id="regSum"></div></div>

      <div class="days-row"><div class="stepper"><button type="button" id="dMinus">−</button><div class="val" id="dVal">3</div><button type="button" id="dPlus">＋</button></div><div class="days-hint" id="dHint"></div></div>
    </div>
    <div class="field"><label class="l" data-i="lbDate"></label><input type="date" class="date-input" id="startDate"></div>

<!-- 3D 全螢幕導航地圖 -->
<div id="mapOverlay">
  <div id="map"></div>
  <div class="m-top">
    <button class="m-close" id="mClose">✕</button>
    <div class="day-pills" id="dayPills"></div>
  </div>
  <button class="avatar-toggle" id="avatarToggle">🚶 步行</button>
  <div class="hud" id="hud">

  <div class="spot-card" id="spotCard"><button class="x" id="spotX">✕</button><div class="t" id="spotT"></div><div class="d" id="spotD"></div></div>
  <div class="m-toast" id="mToast"></div>
  <div class="m-bottom">
    <div class="m-actions" id="mActions"></div>
  </div>
</div>

<script>

];
const WMO={0:["☀️"],1:["🌤️"],2:["⛅"],3:["☁️"],45:["🌫️"],48:["🌫️"],51:["🌦️"],53:["🌦️"],55:["🌧️"],56:["🌧️"],57:["🌧️"],61:["🌧️"],63:["🌧️"],65:["🌧️"],66:["🌧️"],67:["🌧️"],71:["🌨️"],73:["❄️"],75:["❄️"],77:["🌨️"],80:["🌦️"],81:["🌧️"],82:["⛈️"],85:["🌨️"],86:["❄️"],95:["⛈️"],96:["⛈️"],99:["⛈️"]};

const REGIONS={
  tokyo:{name:"東京",en:"Tokyo",emo:"🗼",center:[139.7671,35.6812],bookCity:"Tokyo",
    transit:{sys:"東京 Metro＋都營地下鐵＋JR 山手線",pass:"Suica/PASMO、Tokyo Subway 24/48/72h 票",tip:"市區以地鐵為主、善用轉乘；近郊用 JR",sysE:"Tokyo Metro + Toei Subway + JR Yamanote Line",passE:"Suica/PASMO, Tokyo Subway 24/48/72h ticket",tipE:"Subway covers the city; JR for the suburbs"},
    spots:[

let state={regions:["tokyo"],days:3,prefs:[],lastResult:null};
let lang='zh';
const $=s=>document.querySelector(s);
const MAX_DAYS=14;
const t=k=>T[lang][k];
const rname=r=>lang==='en'?r.en:r.name;
const sname=s=>lang==='en'?s.en:s.name;
const sdesc=s=>lang==='en'?s.ed:s.desc;
const tagLabel=k=>{const p=PREFS.find(x=>x.k===k);return (p?(lang==='en'?p.en:p.label):k).replace(/^\S+\s/,'');};
function spotsPerDay(d){return d<=2?5:d===3?4:d<=5?3:d<=8?2:1;}
function allocateDays(total,n){const b=Math.floor(total/n);let r=total-b*n;const a=Array.from({length:n},()=>b);for(let i=0;i<n&&r>0;i++){a[i]++;r--;}return a;}
function addDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fmtTime(min){let h=Math.floor(min/60)%24,m=min%60;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;}
function applyStatic(){
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll("[data-ihtml]").forEach(el=>el.innerHTML=t(el.dataset.ihtml));
}
function rebuildRegions(){
  const rg=$("#regionGrid");
  rg.innerHTML=Object.entries(REGIONS).map(([k,r])=>`<div class="region" data-r="${k}"><span class="emo">${r.emo}</span>${rname(r)}</div>`).join("");
  rg.querySelectorAll(".region").forEach(el=>el.onclick=()=>{
    const k=el.dataset.r,i=state.regions.indexOf(k);
    if(i>=0){if(state.regions.length>1)state.regions.splice(i,1);}else state.regions.push(k);
    paintRegions();updateSummary();
  });
  paintRegions();updateSummary();
}
function paintRegions(){
  document.querySelectorAll("#regionGrid .region").forEach(el=>{
    const k=el.dataset.r,idx=state.regions.indexOf(k);
    el.classList.toggle("active",idx>=0);
    let o=el.querySelector(".ord");
    if(idx>=0&&state.regions.length>1){if(!o){o=document.createElement("span");o.className="ord";el.appendChild(o);}o.textContent=idx+1;}else if(o)o.remove();
  });
}
function rebuildChips(){
  const pc=$("#prefChips");
  pc.innerHTML=PREFS.map(p=>`<div class="chip ${state.prefs.includes(p.k)?'active':''}" data-k="${p.k}">${lang==='en'?p.en:p.label}</div>`).join("");
  pc.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{el.classList.toggle("active");const k=el.dataset.k;if(state.prefs.includes(k))state.prefs=state.prefs.filter(x=>x!==k);else state.prefs.push(k);});
}
function updateDays(){$("#dVal").textContent=state.days;$("#dHint").textContent=T[lang].nights(state.days);updateSummary();}
function updateSummary(){
  const el=$("#regSum");if(!el)return;
  const names=state.regions.map(k=>rname(REGIONS[k]));
  let s=T[lang].selected(names.length,names.join(" → "));
  if(names.length>1){const a=allocateDays(state.days,names.length);const p=[];names.forEach((n,i)=>{if(a[i]>0)p.push(`${n} ${T[lang].dayUnit(a[i])}`);});s+="<br>"+T[lang].alloc(state.days,p.join(T[lang].sep));if(p.length<names.length)s+=T[lang].allocDrop(names.length-p.length);}
  else s+="<br>"+T[lang].single(spotsPerDay(state.days));
  el.innerHTML=s;
}
function setLang(l){lang=l;applyStatic();rebuildRegions();rebuildChips();updateDays();$("#langBtn").textContent=lang==='zh'?'EN':'中文';if(state.lastResult)renderResult(state.lastResult);}

function planItinerary(region,days,prefs){
  const scored=region.spots.map(s=>{let sc=0;prefs.forEach(p=>{if(s.tags.includes(p))sc+=2;});sc+=Math.random()*0.9;return {...s,score:sc};}).sort((a,b)=>b.score-a.score);
  const per=spotsPerDay(days);
  const byArea={};scored.forEach(s=>{(byArea[s.area]=byArea[s.area]||[]).push(s);});
  const queue=[];Object.values(byArea).sort((a,b)=>b.length-a.length).forEach(g=>{g.sort((a,b)=>b.score-a.score).forEach(s=>queue.push(s));});
  const plan=[];
  for(let d=0;d<days;d++){const chunk=queue.splice(0,per);let tm=9*60;const stops=chunk.map(s=>{const o={...s,time:fmtTime(tm)};tm+=Math.round(s.dur*60)+30;return o;});plan.push({stops});}
  return plan;
}
async function fetchWeather(region,days,startDate){
  const c=region.center;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${c[1]}&longitude=${c[0]}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16`;
  const r=await fetch(url);if(!r.ok)throw 0;const j=await r.json();const d=j.daily;
  let i0=0;if(startDate&&d.time.includes(startDate))i0=d.time.indexOf(startDate);
  const out=[];for(let i=i0;i<d.time.length&&out.length<days;i++)out.push({date:d.time[i],code:d.weather_code[i],hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),rain:d.precipitation_probability_max[i]});
  return out;
}
async function fetchFX(){try{const r=await fetch("https://open.er-api.com/v6/latest/TWD");const j=await r.json();if(j&&j.rates&&j.rates.JPY)return j.rates.JPY;}catch(e){}return 4.75;}
async function generate(){
  const keys=state.regions.slice();if(!keys.length)return;
  const days=state.days,startDate=$("#startDate").value||null;
  const res=$("#results");$("#goBtn").disabled=true;
  const alloc=allocateDays(days,keys.length);const picked=[];keys.forEach((k,i)=>{if(alloc[i]>0)picked.push({key:k,days:alloc[i]});});
  const dropped=keys.length-picked.length;
  res.innerHTML=`<div class="loading fade"><div class="spin"></div>${T[lang].loading(picked.length,days)}</div>`;
  res.scrollIntoView({behavior:"smooth",block:"start"});
  let cursor=0;const segs=[],wxP=[],flatDays=[];
  picked.forEach(pk=>{
    const region=REGIONS[pk.key];const segStart=startDate?addDays(startDate,cursor):null;
    const itin=planItinerary(region,pk.days,state.prefs);
    itin.forEach((d,ii)=>{d.gday=cursor+ii+1;flatDays.push({regionKey:pk.key,region,gday:d.gday,localDay:ii+1,stops:d.stops});});
    segs.push({regionKey:pk.key,region,days:pk.days,startDate:segStart,itin,weather:null});
    wxP.push(fetchWeather(region,pk.days,segStart).catch(()=>null));cursor+=pk.days;
  });
  const [weathers,fx]=await Promise.all([Promise.all(wxP),fetchFX()]);
  segs.forEach((s,i)=>s.weather=weathers[i]);
  state.lastResult={segs,flatDays,fx,startDate,days,dropped};
  renderResult(state.lastResult);
  $("#goBtn").disabled=false;
}

const MAP={map:null,ready:false,markers:[],flatIdx:0,avatarMode:'car',three:null,nav:null,raf:null,pulseRaf:null};

function hav(a,b){const R=6371000,toR=x=>x*Math.PI/180;const dLa=toR(b[1]-a[1]),dLo=toR(b[0]-a[0]);const s=Math.sin(dLa/2)**2+Math.cos(toR(a[1]))*Math.cos(toR(b[1]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function brng(a,b){const toR=x=>x*Math.PI/180;const y=Math.sin(toR(b[0]-a[0]))*Math.cos(toR(b[1]));const x=Math.cos(toR(a[1]))*Math.sin(toR(b[1]))-Math.sin(toR(a[1]))*Math.cos(toR(b[1]))*Math.cos(toR(b[0]-a[0]));return Math.atan2(y,x);}
function lerpLL(a,b,f){return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}
function speak(txt){try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(txt);u.lang=lang==='en'?'en-US':'zh-TW';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* --- Three.js 程式化車輛與旅人（單位：公尺） --- */
function buildCar(){
  const g=new THREE.Group();
  const white=new THREE.MeshStandardMaterial({color:0xf5f7fa,roughness:.35,metalness:.1});
  const glass=new THREE.MeshStandardMaterial({color:0x9fc0e8,roughness:.1,metalness:.3});
  const dark=new THREE.MeshStandardMaterial({color:0x222831,roughness:.6});
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.8,4.4),white);body.position.y=0.65;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.75,0.7,2.2),glass);cabin.position.set(0,1.25,-0.1);g.add(cabin);
  MAP._brake=new THREE.MeshStandardMaterial({color:0xff2b2b,emissive:0xff0000,emissiveIntensity:0.3,roughness:.4});
  [-0.65,0.65].forEach(x=>{const bl=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.18,0.1),MAP._brake);bl.position.set(x,0.75,-2.2);g.add(bl);});
  const wheelGeo=new THREE.CylinderGeometry(0.42,0.42,0.3,16);wheelGeo.rotateZ(Math.PI/2);
  [[-0.9,1.3],[0.9,1.3],[-0.9,-1.3],[0.9,-1.3]].forEach(([x,z])=>{const w=new THREE.Mesh(wheelGeo,dark);w.position.set(x,0.42,z);g.add(w);});
  return g;
}
function buildTraveler(){
  const g=new THREE.Group();
  const skin=new THREE.MeshStandardMaterial({color:0xfde6c4,roughness:.6});
  const coat=new THREE.MeshStandardMaterial({color:0x2563eb,roughness:.5});
  const pants=new THREE.MeshStandardMaterial({color:0x334155,roughness:.7});
  const pack=new THREE.MeshStandardMaterial({color:0xf97316,roughness:.6});
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.33,18,18),skin);head.position.y=1.62;g.add(head);
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.28,0.5,6,12),coat);torso.position.y=1.05;g.add(torso);
  const bp=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.55,0.26),pack);bp.position.set(0,1.12,-0.34);g.add(bp);
  [[-0.15,pants,0.66],[0.15,pants,0.66]].forEach(([x,m,y])=>{const leg=new THREE.Mesh(new THREE.CapsuleGeometry(0.12,0.5,6,10),m);leg.position.set(x,y-0.3,0);g.add(leg);});
  [[-0.38,1.1],[0.38,1.1]].forEach(([x,y])=>{const arm=new THREE.Mesh(new THREE.CapsuleGeometry(0.1,0.42,6,10),coat);arm.position.set(x,y,0);g.add(arm);});
  g.scale.setScalar(1.5);
  return g;
}
function makeThreeLayer(){
  return {
    id:'avatar3d',type:'custom',renderingMode:'3d',
    onAdd(map,gl){
      this.map=map;this.camera=new THREE.Camera();this.scene=new THREE.Scene();
      this.scene.add(new THREE.AmbientLight(0xffffff,1.35));
      const d=new THREE.DirectionalLight(0xffffff,1.1);d.position.set(30,80,50);this.scene.add(d);
      this.car=buildCar();this.trav=buildTraveler();
      this.scene.add(this.car);this.scene.add(this.trav);
      this.renderer=new THREE.WebGLRenderer({canvas:map.getCanvas(),context:gl,antialias:true});
      this.renderer.autoClear=false;
      this.visible=false;this.heading=0;this.t=null;
      MAP.three=this;this.setMode(MAP.avatarMode);
    },
    setMode(m){if(this.car)this.car.visible=(m==='car');if(this.trav)this.trav.visible=(m!=='car');},
    render(gl,matrix){
      if(!this.visible||!this.t){this.renderer.resetState();return;}
      const t=this.t;
      const rotX=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1,0,0),Math.PI/2);
      const rotZ=new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0,0,1),this.heading);
      const m=new THREE.Matrix4().fromArray(matrix);
      const l=new THREE.Matrix4().makeTranslation(t.x,t.y,t.z).scale(new THREE.Vector3(t.s,-t.s,t.s)).multiply(rotX).multiply(rotZ);
      this.camera.projectionMatrix=m.clone().multiply(l);
      this.renderer.resetState();this.renderer.render(this.scene,this.camera);
    }
  };
}
function setAvatar(lng,lat,headingRad){
  const l=MAP.three;if(!l)return;
  const mc=maplibregl.MercatorCoordinate.fromLngLat([lng,lat],0);
  l.t={x:mc.x,y:mc.y,z:mc.z,s:mc.meterInMercatorCoordinateUnits()};
  l.heading=-headingRad;l.visible=true;
  if(MAP.map)MAP.map.triggerRepaint();
}
function hideAvatar(){if(MAP.three){MAP.three.visible=false;if(MAP.map)MAP.map.triggerRepaint();}}

function initMap(){
  if(MAP.map)return;
  if(typeof maplibregl==='undefined'){toast(lang==='en'?'Map library failed to load':'地圖函式庫載入失敗',true);return;}
  MAP.map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:REGIONS[state.regions[0]].center,zoom:15,pitch:45,bearing:0,antialias:true,attributionControl:{compact:true}});
  MAP.map.on('load',()=>{
    try{
      const layers=MAP.map.getStyle().layers;let firstSym=null;
      for(const ly of layers){if(ly.type==='symbol'){firstSym=ly.id;break;}}
      if(!MAP.map.getLayer('bldg3d')){
        MAP.map.addLayer({id:'bldg3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:14,
          paint:{'fill-extrusion-color':'#e9edf3','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],10],'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],'fill-extrusion-opacity':0.9}},firstSym);
      }
    }catch(e){}
    // route layers
    MAP.map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
    MAP.map.addLayer({id:'route-glow',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#1f6feb','line-width':16,'line-opacity':0.3,'line-blur':8}});
    MAP.map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#49a3ff','line-width':6,'line-opacity':0.95}});
    MAP.map.addSource('pulse',{type:'geojson',data:{type:'Feature',geometry:{type:'Point',coordinates:[0,0]}}});
    MAP.map.addLayer({id:'pulse',type:'circle',source:'pulse',paint:{'circle-radius':4,'circle-color':'#1f6feb','circle-opacity':0}});
    MAP.map.addLayer(makeThreeLayer());
    MAP.ready=true;
    renderDay(MAP.flatIdx);
  });
}

/* --- 3D 飛越預覽 --- */
async function flythrough(stops){
  stopNav();hideAvatar();$("#spotCard").classList.remove("on");
  toast(T[lang].toastPreview);
  for(let i=0;i<stops.length;i++){
    const s=stops[i];const next=stops[i+1];
    const bearing=next?brng(s.ll,next.ll)*180/Math.PI:0;
    await new Promise(res=>{
      MAP.map.flyTo({center:s.ll,zoom:17,pitch:62,bearing,duration:1800,essential:true,easing:t=>1-Math.pow(1-t,3)});
      setTimeout(()=>{showSpotCard(s);speak((lang==='en'?'Stop ':'第 ')+(i+1)+(lang==='en'?': ':' 站 ')+sname(s));},1200);
      setTimeout(res,2300);
    });
  }
  hideToast();
}

/* --- 3D 導航（2D→3D 俯衝 + 沿路線移動 + HUD + 語音 + 抵達脈衝） --- */
async function buildDayRoute(stops){
  const driving=MAP.avatarMode==='car';
  let full=[];const spotAt=[0];
  for(let i=0;i<stops.length-1;i++){
    let seg=await routeOSRM(stops[i].ll,stops[i+1].ll,driving);
    if(i>0)seg=seg.slice(1);
    full=full.concat(seg);spotAt.push(full.length-1);
  }
  return {full,spotAt};
}
async function routeOSRM(a,b,driving){
  try{
    const prof=driving?'driving':'foot';
    const u=`https://router.project-osrm.org/route/v1/${prof}/${a[0]},${a[1]};${b[0]},${b[1]}?overview=full&geometries=geojson`;
    const r=await fetch(u);const j=await r.json();
    if(j.routes&&j.routes[0]&&j.routes[0].geometry.coordinates.length>1)return j.routes[0].geometry.coordinates;
  }catch(e){}
  const pts=[];const N=28;for(let k=0;k<=N;k++)pts.push(lerpLL(a,b,k/N));return pts;
}
async function startNav(stops){
  stopNav();$("#spotCard").classList.remove("on");
  toast(T[lang].toastRoute,true);
  const {full,spotAt}=await buildDayRoute(stops);
  hideToast();
  if(full.length<2){toast(T[lang].toastNoRoute);return;}
  setRoute(full);
  const cum=NavCore.cumulative(full);
  const total=cum[cum.length-1];
  const spotDist=spotAt.map(i=>cum[Math.min(i,cum.length-1)]);
  $("#hud").classList.add("on");
  const start=full[0],b0=NavCore.brng(full[0],full[Math.min(3,full.length-1)]);
  // 2D -> 3D 俯衝（進場動畫期間不搶鏡頭）
  MAP.map.flyTo({center:start,zoom:MAP.avatarMode==='car'?17.5:18.3,pitch:66,bearing:b0*180/Math.PI,duration:1800,essential:true,easing:t=>1-Math.pow(1-t,3)});
  setAvatar(start[0],start[1],b0);
  speak(lang==='en'?'Navigation started. Move at your own pace.':'導航開始，依你的步調前進即可。');
  MAP.nav={active:true,stops,full,cum,total,spotDist,progress:0,target:0,lastProg:0,lastArr:0,nextSpot:1,speed:0,mode:'real',gotFix:false,chaseAt:performance.now()+1800};
  ensureSimBtn();
  startWatch();
  setTimeout(()=>{ if(MAP.nav&&!MAP.nav.gotFix&&MAP.nav.mode==='real') toast(lang==='en'?'Waiting for your movement… or tap 🧪 to simulate':'等待你移動…（桌機可按 🧪 模擬行走）',true); },4500);
  MAP.raf=requestAnimationFrame(navTick);
}
function navTick(){
  const nav=MAP.nav; if(!nav||!nav.active)return;
  // 1Hz GPS → 60fps 平滑：progress 以阻尼追向 target
  nav.progress += (nav.target-nav.progress)*0.14;
  if(Math.abs(nav.target-nav.progress)<0.3) nav.progress=nav.target;
  const prog=Math.max(0,Math.min(nav.total,nav.progress));
  const {ll,seg}=NavCore.posAtDistance(nav.full,nav.cum,prog);
  const hb=NavCore.brng(nav.full[seg],nav.full[Math.min(seg+1,nav.full.length-1)]);
  setAvatar(ll[0],ll[1],hb);
  if(performance.now()>=nav.chaseAt) MAP.map.jumpTo({center:ll,bearing:hb*180/Math.PI,pitch:66,zoom:MAP.avatarMode==='car'?17.5:18.3});
  NavCore.arrivalsPassed(nav.lastProg,prog,nav.spotDist,18).forEach(idx=>{ if(idx>nav.lastArr){nav.lastArr=idx;arrivePulse(nav.stops[idx].ll);speak((lang==='en'?'Arrived: ':'已抵達 ')+sname(nav.stops[idx]));toast('📍 '+sname(nav.stops[idx]));} });
  nav.lastProg=prog;
  let ns=nav.spotDist.findIndex(d=>d>prog+1); if(ns<0)ns=nav.stops.length-1; nav.nextSpot=ns;
  const remain=NavCore.remainingToSpot(prog,nav.spotDist[ns]);
  $("#hudDist").textContent=remain>=1000?(remain/1000).toFixed(1)+' km':Math.round(remain)+' m';
  $("#hudInstr").textContent=(lang==='en'?'To ':'前往 ')+sname(nav.stops[ns]);
  $("#hudArrow").textContent=remain<40?'📍':'⬆️';
  const spd=nav.speed||0;
  $("#hudRoad").textContent=(MAP.avatarMode==='car'?'🚗':'🚶')+' '+(spd>0.3?(spd*3.6).toFixed(0)+' km/h':(nav.mode==='sim'?(lang==='en'?'simulating':'模擬中'):(lang==='en'?'waiting to move':'等待移動')));
  const etaS=spd>0.5?Math.round(remain/spd):null;
  $("#hudEta").textContent=etaS!=null?(T[lang].eta+' '+(etaS>=60?Math.round(etaS/60)+'m':etaS+'s')):'—';
  $("#hudThen").textContent=nav.stops[ns+1]?(T[lang].then+' → '+sname(nav.stops[ns+1])):'';
  if(prog>=nav.total-1&&nav.lastArr>=nav.stops.length-1){finishNav(nav.stops);return;}
  MAP.raf=requestAnimationFrame(navTick);
}
function startWatch(){
  const nav=MAP.nav; if(!nav)return;
  if(!navigator.geolocation){enableSim(true);return;}
  try{
    nav.watchId=navigator.geolocation.watchPosition(pos=>{
      if(!MAP.nav||MAP.nav.mode==='sim')return;
      const snap=NavCore.snapToRoute([pos.coords.longitude,pos.coords.latitude],MAP.nav.full,MAP.nav.cum);
      if(snap.offset<60 && snap.dist>MAP.nav.target-8) MAP.nav.target=snap.dist; // 只前進、濾掉大漂移
      MAP.nav.speed=Math.max(0,pos.coords.speed||0);
      MAP.nav.gotFix=true;
    },()=>{ if(MAP.nav&&MAP.nav.mode==='real'){enableSim(true);toast(lang==='en'?'Location blocked — walk simulation on':'定位被拒，已開啟模擬行走');} },
    {enableHighAccuracy:true,maximumAge:1000,timeout:20000});
  }catch(e){enableSim(true);}
}
function enableSim(on){
  const nav=MAP.nav; if(!nav)return;
  clearInterval(nav.simItv);
  if(on){
    nav.mode='sim';
    const v=MAP.avatarMode==='car'?11:1.4; // m/s：真實步行/行車速度
    nav.simItv=setInterval(()=>{ if(!MAP.nav)return; MAP.nav.target=Math.min(MAP.nav.total,MAP.nav.target+v*0.25); MAP.nav.speed=v; },250);
  }else{ nav.mode='real'; nav.speed=0; }
  const b=$("#simBtn"); if(b)b.textContent=(nav.mode==='sim'?'⏸ 停止模擬':'🧪 模擬行走');
}
function ensureSimBtn(){
  if($("#simBtn"))return;
  const b=document.createElement('button');
  b.id='simBtn';b.textContent='🧪 模擬行走';
  b.style.cssText='position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:12;border:0;border-radius:12px;padding:9px 13px;font-weight:800;font-size:12.5px;color:#fff;background:rgba(13,21,38,.85);backdrop-filter:blur(6px);font-family:inherit';
  b.onclick=()=>enableSim(MAP.nav&&MAP.nav.mode!=='sim');
  $("#mapOverlay").appendChild(b);
}
function arrivePulse(ll){
  if(!MAP.map.getSource('pulse'))return;
  MAP.map.getSource('pulse').setData({type:'Feature',geometry:{type:'Point',coordinates:ll}});
  let r=4,op=0.6;cancelAnimationFrame(MAP.pulseRaf);
  const step=()=>{r+=2.2;op-=0.012;MAP.map.setPaintProperty('pulse','circle-radius',r);MAP.map.setPaintProperty('pulse','circle-opacity',Math.max(0,op));if(op>0)MAP.pulseRaf=requestAnimationFrame(step);};
  step();
}
function clearNavWatch(){ if(MAP.nav){ if(MAP.nav.watchId!=null&&navigator.geolocation){try{navigator.geolocation.clearWatch(MAP.nav.watchId);}catch(e){}} clearInterval(MAP.nav.simItv); } }
function finishNav(stops){
  clearNavWatch();MAP.nav=null;cancelAnimationFrame(MAP.raf);
  const sb=$("#simBtn");if(sb)sb.remove();
  const last=stops[stops.length-1];
  toast(T[lang].toastArrived);speak(T[lang].toastArrived);
  let ang=0;const orbit=()=>{if(MAP.nav)return;ang+=0.4;MAP.map.jumpTo({center:last.ll,bearing:ang,pitch:60,zoom:17.5});if(ang<90){MAP._orbit=requestAnimationFrame(orbit);}else{setTimeout(()=>{$("#hud").classList.remove("on");hideAvatar();renderDay(MAP.flatIdx);},800);}};
  MAP._orbit=requestAnimationFrame(orbit);
}
function stopNav(){clearNavWatch();if(MAP.nav)MAP.nav.active=false;MAP.nav=null;cancelAnimationFrame(MAP.raf);cancelAnimationFrame(MAP._orbit);cancelAnimationFrame(MAP.pulseRaf);$("#hud").classList.remove("on");const sb=$("#simBtn");if(sb)sb.remove();}

/* --- 開關全螢幕地圖 --- */
function openMapForDay(flatIdx,spotIdx){
  if(!state.lastResult)return;
  $("#mapOverlay").classList.add("on");
  MAP.flatIdx=flatIdx;
  if(!MAP.map){initMap();}
  else{if(MAP.map.resize)MAP.map.resize();renderDay(flatIdx);}
  if(spotIdx>=0){setTimeout(()=>{const s=state.lastResult.flatDays[flatIdx].stops[spotIdx];if(s){showSpotCard(s);MAP.map.easeTo({center:s.ll,zoom:16.5,pitch:55,duration:900});}},MAP.ready?300:1600);}
}
function closeMap(){stopNav();speechSynthesis&&speechSynthesis.cancel();$("#mapOverlay").classList.remove("on");}
function toggleAvatar(){
  MAP.avatarMode=MAP.avatarMode==='car'?'character':'car';
  $("#avatarToggle").textContent=MAP.avatarMode==='car'?T[lang].avatarWalk:T[lang].avatarCar;
  if(MAP.three)MAP.three.setMode(MAP.avatarMode);
}

/* --- 綁定與初始化 --- */
$("#mClose").onclick=closeMap;
$("#hudExit").onclick=()=>{stopNav();hideAvatar();renderDay(MAP.flatIdx);};
$("#spotX").onclick=()=>$("#spotCard").classList.remove("on");
$("#avatarToggle").onclick=toggleAvatar;
$("#avatarToggle").textContent=T.zh.avatarWalk;
buildForm();
</script>
